<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting for questions, reservations, or general inquiries. Reach out via email, phone, or form.">
    <meta name="author" content="Chris De La Harpe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <!-- Contact Information & Company Details -->
        <section class="company-info">
            <h2>Get in Touch</h2>
            <p>Address: 123 River Run Rd, Salmon, ID 83467</p>
            <p>Phone: (208) 555-0199</p>
            <p>Email: info@whitewaterrafting.com</p>
        </section>

        <!-- Employee Profiles (3 images) -->
        <section class="employees">
            <h2>Our Team</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Jane Doe, Lead River Guide">
                <figcaption>Jane Doe - Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="John Smith, Safety Director">
                <figcaption>John Smith - Safety Director</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Alex Johnson, Operations Manager">
                <figcaption>Alex Johnson - Operations Manager</figcaption>
            </figure>
        </section>

        <!-- Contact Form -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter"> Please subscribe me to
                    the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©2026 White Water Rafting | Chris De La Harpe</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-logo.jpg"
                  alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin-icon.jpg"
                  alt="LinkedIn Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-icon.jpg"
                  alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
