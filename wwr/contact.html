<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting in Salmon, Idaho with questions, reservation requests, or website suggestions. Find our address, phone, email, map, and team.">
    <meta name="author" content="Chris De La Harpe">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwrlogo.jpg" alt="Splash White Water Rafting logo" width="200" height="200">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <!-- Company Information + Map -->
        <section class="company-info">
            <div class="company-details">
                <h2>Get in Touch</h2>
                <p>Address: 123 River Run Rd, Salmon, ID 83467</p>
                <p>Phone: (208) 555-0199</p>
                <p>Email: info@whitewaterrafting.com</p>
            </div>
            <!-- Google Map embed (inline style="border:0" removed; styled in rafting.css) -->
            <iframe src="https://www.google.com/maps?q=Salmon+River,+Salmon,+ID+83467&amp;z=12&amp;output=embed"
              width="400" height="300" allowfullscreen loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              title="Google Map of White Water Rafting in Salmon, Idaho"></iframe>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>Our Team</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Sam Rivera, Lead River Guide, smiling in a pink helmet" width="150" height="150">
                <figcaption>Sam Rivera - Lead River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="John Smith, Safety Director, wearing a white helmet with a camera" width="150" height="150">
                <figcaption>John Smith - Safety Director</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Alex Johnson, Operations Manager, in a blue helmet and life jacket" width="150" height="150">
                <figcaption>Alex Johnson - Operations Manager</figcaption>
            </figure>
        </section>

        <!-- Contact Form -->
        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" autocomplete="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <label for="newsletter" class="checkbox-label">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©2026 🌊 White Water Rafting 🌊 Chris De La Harpe</p>

        <!-- Social media links -->
        <nav class="sociallinks">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook-logo.jpg" alt="Facebook icon" width="150" height="150">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="images/linkedin-icon.jpg" alt="LinkedIn icon" width="150" height="150">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram-icon.jpg" alt="Instagram icon" width="150" height="150">
            </a>
        </nav>
    </footer>
</body>

</html>
